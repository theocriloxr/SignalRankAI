# Ruff configuration — excludes legacy root-level scripts that predate the governance model
# Blueprint Module 117: Repository and Documentation Hygiene
line-length = 120

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long — formatter handles this
    "E741",  # ambiguous variable names — too noisy in legacy code
    "F841",  # local variable assigned but never used — catch blocks
    "W291",  # trailing whitespace — auto-fixable
    "W293",  # whitespace on blank lines — auto-fixable
]

exclude = [
    ".git",
    "__pycache__",
    "node_modules",
    "frontend",
    "mobile",
    "legacy_telegram",
    "deployment_package",
    "deployment_evidence",
    "staging-migration-manual",
    "staging-release",
    "staging-rollout",
    "production-release",
    "production-ml-certifier-disabled",
]

[lint.per-file-ignores]
# Legacy root-level scripts
"FIX_*.py" = ["ALL"]
