<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Signal Rank AI</title>
  <desc id="desc">Signal Rank AI logo with angular gradient S mark and white wordmark</desc>
  <defs>
    <linearGradient id="brand" x1="370" y1="125" x2="628" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05E8FF"/>
      <stop offset=".46" stop-color="#2F91FF"/>
      <stop offset="1" stop-color="#B44CFF"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".36" r=".58">
      <stop offset="0" stop-color="#3D75FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="650" rx="44" fill="#05060A"/>
  <circle cx="500" cy="290" r="260" fill="url(#halo)"/>
  <g fill="url(#brand)" filter="url(#glow)" transform="translate(300 82) scale(1.08)">
    <path d="M151 118h232l-50 58H200l-27 31h132l-49 57H75l49-57h-1l75-89h-47z"/>
    <path d="M359 247l-49 57H178l-29 34h213l-50 58H78l51-58h-1l78-91h153z"/>
  </g>
  <text x="500" y="565" text-anchor="middle" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" letter-spacing="5">SIGNAL RANK AI</text>
</svg>