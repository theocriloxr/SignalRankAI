# Isolated UI acceptance API. Its database and Redis must belong to staging.
# No engine, delivery, broker or financial execution credentials are needed.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
startCommand = "bash start.sh"
preDeployCommand = ["python scripts/controlled_migrate.py"]
preDeployTimeoutSeconds = 900
healthcheckPath = "/readyz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
