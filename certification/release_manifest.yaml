{
  "schema_version": "2.0",
  "description": "Canonical SignalRankAI release certification manifest. CI, cleanroom, staging and release tooling consume these gates.",
  "target_runtime": {
    "python": "3.11",
    "dependency_lock": "requirements.lock"
  },
  "gates": [
    {
      "id": "static-ruff",
      "group": "static",
      "description": "Ruff correctness lint",
      "command": "ruff check .",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom",
        "local"
      ]
    },
    {
      "id": "static-pyright",
      "group": "static",
      "description": "Pyright type analysis",
      "command": "pyright .",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom",
        "local"
      ]
    },
    {
      "id": "security-bandit",
      "group": "static",
      "description": "Bandit security scan",
      "command": "bandit -r -ll -ii core engine web worker db strategies services",
      "severity": "high",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "security-pip-audit",
      "group": "static",
      "description": "Python dependency vulnerability audit",
      "command": "pip-audit -r requirements.lock",
      "severity": "high",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "security-semgrep",
      "group": "static",
      "description": "Semgrep SAST",
      "command": "semgrep scan --config auto --error core engine web worker db strategies services",
      "severity": "high",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "shellcheck",
      "group": "static",
      "description": "Shell entrypoint lint",
      "command": "shellcheck start.sh",
      "severity": "high",
      "required": true,
      "environments": [
        "ci"
      ]
    },
    {
      "id": "backend-compile",
      "group": "backend",
      "description": "Compile runtime Python",
      "command": "python -m compileall -q core engine web worker db data strategies services ml signalrank_telegram runtime execution",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom",
        "staging"
      ]
    },
    {
      "id": "backend-release-chain",
      "group": "backend",
      "description": "Offline render and validate complete current Alembic release chain",
      "command": "python scripts/verify_release_chain.py",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "backend-migrate",
      "group": "backend",
      "description": "Apply migrations to head",
      "command": "python -m alembic upgrade head",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom",
        "staging"
      ]
    },
    {
      "id": "backend-heads",
      "group": "backend",
      "description": "Require one Alembic migration head",
      "command": "python scripts/assert_single_alembic_head.py",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom",
        "staging"
      ]
    },
    {
      "id": "backend-governance",
      "group": "backend",
      "description": "Governance artifact consistency",
      "command": "python scripts/build_v7_governance.py --check",
      "severity": "high",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "backend-secret-scan",
      "group": "backend",
      "description": "Repository secret scan",
      "command": "python scripts/secret_scan.py",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "backend-critical-regressions",
      "group": "backend",
      "description": "Release-critical regression contracts",
      "command": "python -m pytest -q tests/test_config_alias_safety.py tests/test_web_platform_runtime_contract.py tests/test_webhook_latency_semantics.py tests/test_ml_learning_runtime_v135.py tests/test_engine_critical_fallbacks_fail_closed.py tests/test_v20_event_platform.py",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "backend-system",
      "group": "backend",
      "description": "Complete system certification",
      "command": "python scripts/run_complete_system_test.py --full --pytest-batches 20 --output-dir artifacts/ci-certification",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "frontend-install",
      "group": "frontend",
      "description": "Install locked frontend graph",
      "command": "cd frontend && npm ci",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "frontend-lint",
      "group": "frontend",
      "description": "Frontend lint",
      "command": "cd frontend && npm run lint",
      "severity": "high",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "frontend-types",
      "group": "frontend",
      "description": "Frontend TypeScript check",
      "command": "cd frontend && npx tsc --noEmit",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "frontend-build",
      "group": "frontend",
      "description": "Next.js production build",
      "command": "cd frontend && npm run build",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "mobile-install",
      "group": "mobile",
      "description": "Install locked mobile graph",
      "command": "cd mobile && npm ci",
      "severity": "critical",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "mobile-types",
      "group": "mobile",
      "description": "Mobile typecheck",
      "command": "cd mobile && npm run typecheck",
      "severity": "high",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "mobile-export",
      "group": "mobile",
      "description": "Expo web export",
      "command": "cd mobile && npx expo export --platform web --output-dir dist-web",
      "severity": "high",
      "required": true,
      "environments": [
        "ci",
        "cleanroom"
      ]
    },
    {
      "id": "staging-soak",
      "group": "staging",
      "description": "24-72h immutable-SHA staging soak",
      "command": "manual:staging_soak",
      "severity": "critical",
      "required": true,
      "environments": [
        "staging"
      ]
    },
    {
      "id": "backup-restore",
      "group": "staging",
      "description": "Restore drill on release schema",
      "command": "python scripts/staging_backup_restore_drill.py",
      "severity": "critical",
      "required": true,
      "environments": [
        "staging"
      ]
    },
    {
      "id": "broker-demo",
      "group": "staging",
      "description": "Demo broker preflight/certification",
      "command": "python scripts/demo_account_preflight.py",
      "severity": "critical",
      "required": true,
      "environments": [
        "staging"
      ]
    }
  ]
}
