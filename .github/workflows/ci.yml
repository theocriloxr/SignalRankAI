name: SignalRankAI CI

on:
  push:
    branches: [main, develop, staging, "fix/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: signalrank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d signalrank_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/signalrank_test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalrank_test
      REDIS_URL: redis://127.0.0.1:6379/0
      STATE_REDIS_URL: redis://127.0.0.1:6379/1
      DELIVERY_REDIS_URL: redis://127.0.0.1:6379/2
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
      REAL_EXECUTION_ENABLED: "0"
      AUTO_EXECUTION_ENABLED: "0"
      COPY_TRADE_ENABLED: "0"
      REAL_PAYOUTS_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m alembic upgrade head
      - run: python -m alembic heads
      - run: python scripts/build_v7_governance.py --check
      - run: python scripts/secret_scan.py
      - run: python scripts/run_complete_system_test.py --full --pytest-batches 20 --output-dir artifacts/ci-certification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-certification
          path: artifacts/ci-certification

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npx expo export --platform web --output-dir dist-web
