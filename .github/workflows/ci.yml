name: SignalRankAI CI

on:
  push:
    branches:
      - main
      - develop
      - staging
      - "fix/**"
      - "feature/**"
      - "feat/**"
      - "implementation/**"
      - implementation-of-master-blueprint
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/run_release_manifest.py --validate --environment ci

  static-quality-checks:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: pip install ruff pyright bandit pip-audit vulture coverage semgrep
      - run: python scripts/run_release_manifest.py --environment ci --group static

  backend:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: signalrank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d signalrank_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/signalrank_test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalrank_test
      REDIS_URL: redis://127.0.0.1:6379/0
      STATE_REDIS_URL: redis://127.0.0.1:6379/1
      DELIVERY_REDIS_URL: redis://127.0.0.1:6379/2
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
      REAL_EXECUTION_ENABLED: "0"
      AUTO_EXECUTION_ENABLED: "0"
      AUTO_TRADE_ENABLED: "0"
      COPY_TRADE_ENABLED: "0"
      PROP_EXECUTION_ENABLED: "0"
      REAL_PAYOUTS_ENABLED: "0"
      GLOBAL_EXECUTION_KILL_SWITCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
      - run: python scripts/run_release_manifest.py --environment ci --group backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-certification-${{ matrix.python-version }}
          path: artifacts/

  frontend:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/run_release_manifest.py --environment ci --group frontend

  mobile:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: python scripts/run_release_manifest.py --environment ci --group mobile
