name: SignalRankAI CI

on:
  push:
    branches:
      - main
      - develop
      - staging
      - "fix/**"
      - "feature/**"
      - "feat/**"
      - "implementation/**"
      - implementation-of-master-blueprint
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/run_release_manifest.py --validate --environment ci

  static-quality-checks:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: python -m pip check
      - name: Install isolated security tools
        run: |
          python -m venv "$RUNNER_TEMP/signalrank-security-tools"
          "$RUNNER_TEMP/signalrank-security-tools/bin/python" -m pip install -r requirements-security-tools.txt
          "$RUNNER_TEMP/signalrank-security-tools/bin/python" -m pip check
          python scripts/install_opengrep.py --directory "$RUNNER_TEMP/signalrank-security-tools/bin"
      - name: Run static gates against the locked runtime
        run: |
          export PATH="$RUNNER_TEMP/signalrank-security-tools/bin:$PATH"
          "$pythonLocation/bin/python" scripts/run_release_manifest.py --environment ci --group static
          "$pythonLocation/bin/python" -m pip check

  backend:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: signalrank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d signalrank_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      SIGNALRANK_POSTGRES_INTEGRATION_REQUIRED: "1"
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/signalrank_test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalrank_test
      REDIS_URL: redis://127.0.0.1:6379/0
      STATE_REDIS_URL: redis://127.0.0.1:6379/1
      DELIVERY_REDIS_URL: redis://127.0.0.1:6379/2
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
      REAL_EXECUTION_ENABLED: "0"
      AUTO_EXECUTION_ENABLED: "0"
      AUTO_TRADE_ENABLED: "0"
      COPY_TRADE_ENABLED: "0"
      PROP_EXECUTION_ENABLED: "0"
      REAL_PAYOUTS_ENABLED: "0"
      GLOBAL_EXECUTION_KILL_SWITCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          python -m pip check
      - run: python scripts/run_release_manifest.py --environment ci --group backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-certification-${{ matrix.python-version }}
          path: artifacts/

  research-browser:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: signalrank_browser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d signalrank_browser_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      SIGNALRANK_POSTGRES_INTEGRATION_REQUIRED: "1"
      SIGNALRANK_ALLOW_DOTENV: "0"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/signalrank_browser_test
      GLOBAL_EXECUTION_KILL_SWITCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime and isolated browser tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
          python -m venv "$RUNNER_TEMP/signalrank-browser-tools"
          "$RUNNER_TEMP/signalrank-browser-tools/bin/python" -m pip install -r requirements-browser-tests.txt
          "$RUNNER_TEMP/signalrank-browser-tools/bin/python" -m pip check
          "$RUNNER_TEMP/signalrank-browser-tools/bin/python" -m playwright install --with-deps chromium
      - name: Verify operator research UX with synthetic owned fixtures
        run: |
          export RESEARCH_BROWSER_PYTHON="$RUNNER_TEMP/signalrank-browser-tools/bin/python"
          python scripts/run_release_manifest.py --environment ci --group research-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-browser-certification
          path: artifacts/research-browser/

  frontend:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/run_release_manifest.py --environment ci --group frontend

  mobile:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: python scripts/run_release_manifest.py --environment ci --group mobile

  railway-credential-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/provider-discovery-readiness-20260923'
    needs: manifest
    runs-on: ubuntu-latest
    environment: signalrank-production-release
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify scoped Railway credential and paper release state without mutations
        env:
          RAILWAY_PRODUCTION_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.check_railway_release_credential

  release-certification:
    # A single stable required check covers matrix jobs and prevents skipped
    # downstream jobs from being mistaken for a certified release.
    if: always()
    needs: [manifest, static-quality-checks, backend, research-browser, frontend, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Require every certification job to succeed
        env:
          CERTIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['CERTIFICATION_RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failures:
              raise SystemExit(f'Release certification incomplete: {failures}')
          print('All release certification jobs succeeded.')
          PY

  approve-production-source:
    # Pin approval belongs to the same check suite as certification. Railway
    # holds deployment requests until this job and the workflow succeed.
    needs: [release-certification, railway-credential-preflight]
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/provider-discovery-readiness-20260923'
    runs-on: ubuntu-latest
    environment: signalrank-production-release
    timeout-minutes: 10
    concurrency:
      group: signalrank-production-source
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Approve and queue the latest certified application source
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_PRODUCTION_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        run: python scripts/approve_production_release.py
