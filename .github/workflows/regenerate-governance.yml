name: Regenerate Governance Artifacts

on:
  push:
    branches:
      - implementation-of-master-blueprint
    paths:
      - "governance-regeneration-trigger/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps -r requirements.lock
          python -m pip check
      - name: Regenerate governance
        run: |
          python scripts/build_v7_governance.py
          python scripts/build_v7_governance.py --check
      - name: Upload generated governance
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-governance
          path: requirements/
          if-no-files-found: error
          retention-days: 3
