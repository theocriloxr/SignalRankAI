name: SignalRankAI frontend design verification

# This job is independent of (and does NOT replace) mandatory release certification.
# It uses no staging/live credentials, brokerage connectivity, payments or DB writes.
on:
  push:
    branches: [main, fix/release-recovery-20261008, design/signalrank-ui-rebuild-20261008]
    paths:
      - 'frontend/**'
      - 'Dockerfile.frontend'
      - 'railway.frontend.toml'
      - 'scripts/*frontend*.py'
      - '.github/workflows/frontend-design-verification.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'Dockerfile.frontend'
      - 'railway.frontend.toml'
      - 'scripts/*frontend*.py'
      - '.github/workflows/frontend-design-verification.yml'

permissions:
  contents: read

jobs:
  nextjs-design:
    name: Next.js UI build and contract tests (not release approval)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_ENV: test
      SIGNALRANK_PLATFORM_API_ORIGIN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use pinned npm version
        run: npm install --global npm@11.17.0
      - name: Install exactly locked packages
        run: npm ci --ignore-scripts
      - name: Lint frontend
        run: npm run lint
      - name: Test canonical transport, presentation and design
        run: npm run test:transport
      - name: Verify dependency safety contract
        run: npm run test:dependencies
      - name: Verify cinematic presentation
        run: npm run test:cinematic
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: TypeScript static check
        run: npx tsc --noEmit
      - name: Production compilation of isolated frontend
        env:
          NODE_ENV: production
        run: npm run build

  browser-integration:
    name: Real frontend and backend browser journeys (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [next, legacy]
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: signalrank_browser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d signalrank_browser_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalrank_browser_test
      SIGNALRANK_ALLOW_DOTENV: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked application and isolated browser tools
        run: |
          npm install --global npm@11.17.0
          npm ci --prefix frontend --ignore-scripts
          python -m pip install -r requirements.lock
          python -m pip check
          python -m venv "$RUNNER_TEMP/signalrank-browser-tools"
          "$RUNNER_TEMP/signalrank-browser-tools/bin/python" -m pip install -r requirements-browser-tests.txt
          "$RUNNER_TEMP/signalrank-browser-tools/bin/python" -m playwright install --with-deps chromium
      - name: Exercise actual production-build UI with owned ephemeral database
        run: >-
          python scripts/run_frontend_browser_drill.py
          --workspace-mode ${{ matrix.workspace }}
          --browser-python "$RUNNER_TEMP/signalrank-browser-tools/bin/python"
          --output-dir artifacts/frontend-browser-${{ matrix.workspace }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-${{ matrix.workspace }}
          path: artifacts/frontend-browser-${{ matrix.workspace }}
