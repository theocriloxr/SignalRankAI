name: Regenerate UI branch governance evidence

# The generator is repository-owned and deterministic. This workflow can only
# update this design branch; it never touches production/staging release refs.
on:
  push:
    branches:
      - design/signalrank-ui-rebuild-20261008
    paths:
      - .github/workflows/regenerate-ui-branch-governance.yml
      - "DESIGN.md"
      - "docs/**"
      - "frontend/**"
      - "services/**"
      - "tests/**"
      - "core/**"
      - "engine/**"

permissions:
  contents: write

concurrency:
  group: signalrank-ui-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'theocriloxr/SignalRankAI' && github.ref == 'refs/heads/design/signalrank-ui-rebuild-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: design/signalrank-ui-rebuild-20261008
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate from the latest remote source, never stale detached evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "signalrank-governance-bot"
          git config user.email "signalrank-governance-bot@users.noreply.github.com"
          target="design/signalrank-ui-rebuild-20261008"
          for attempt in 1 2 3 4; do
            echo "Governance attempt ${attempt}: fetch latest candidate and regenerate from source."
            git fetch --no-tags origin "+refs/heads/${target}:refs/remotes/origin/${target}"
            git reset --hard "refs/remotes/origin/${target}"
            python scripts/build_v7_governance.py
            python scripts/build_v7_governance.py --check
            git diff --check
            if git diff --quiet -- requirements/; then
              echo "Governance already matches the fetched candidate source."
              exit 0
            fi
            git add -- requirements/
            git diff --cached --check
            git commit -m "chore(governance): regenerate UI candidate evidence from real source [skip ci]"
            if git push origin "HEAD:refs/heads/${target}"; then
              echo "Governance published as a fast-forward, based on the latest source."
              exit 0
            fi
            echo "Candidate advanced concurrently; rerun generator after fetching newest source."
            sleep 2
          done
          echo "::error::Governance evidence could not be published without a stale write."
          exit 1
      - name: Verify published evidence remains deterministic
        run: python scripts/build_v7_governance.py --check
